name: Nightly dual-H5 all-services gate

# Heavy job — NOT on pull_request/push (keeps the PR gate fast). Runs nightly and
# on demand. Builds two STM32H5 firmwares, then runs all 27 UDS services with
# the pinned released LabWired CLI across two emulated Cortex-M33 MCUs over a
# virtual FDCAN bus.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  h5-allservices-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout udslib
        uses: actions/checkout@v4

      - name: Install clang (arm-none-eabi cross target)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust (rust-lld linker)
        uses: dtolnay/rust-toolchain@stable

      - name: Build both H5 firmwares
        run: |
          export UDSLIB_DIR="$PWD"
          export RUST_LLD="$(find "$(rustc --print sysroot)" -name rust-lld | head -1)"
          echo "Using rust-lld: $RUST_LLD"
          make -C examples/h5_uds_ecu_full/firmware
          make -C examples/h5_uds_tester/firmware

      - name: Run the all-services gate (headless, asserts 27/27)
        id: labwired
        uses: w1ne/labwired-core/.github/actions/labwired-test@0cadd18fc9a3c0cbd1ecb0a6ddcd8ce66d56283d
        with:
          version: v0.19.2
          script: examples/h5_uds_tester/allservices-gate.yaml
          output-dir: labwired-uds-report
          args: --no-uart-stdout

      # The gate's own oracle is a single 27-bit word, so a failure reads as
      # `expected 0x7ffffff, got 0x7fffffe` and names no service. Decode the
      # tester's UART transcript into one result per service, publish it to the
      # run summary, and annotate whichever services failed.
      - name: Decode per-service UDS results
        if: ${{ always() }}
        run: |
          python3 tools/uds_gate_report.py \
            --uart labwired-uds-report/uart.log \
            --junit uds-service-report/junit-services.xml \
            --markdown uds-service-report/services.md

      - name: Upload per-service UDS report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: uds-service-report-${{ github.run_id }}
          path: uds-service-report
          retention-days: 90
          if-no-files-found: error
