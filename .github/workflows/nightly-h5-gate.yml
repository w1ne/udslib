name: Nightly dual-H5 all-services gate

# Heavy job — NOT on pull_request/push (keeps the PR gate fast). Runs nightly and
# on demand. Builds two STM32H5 firmwares, then runs all 27 UDS services with
# the pinned released LabWired CLI across two emulated Cortex-M33 MCUs over a
# virtual FDCAN bus.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  h5-allservices-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout udslib
        uses: actions/checkout@v4

      - name: Install clang (arm-none-eabi cross target)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install Rust (rust-lld linker)
        uses: dtolnay/rust-toolchain@stable

      - name: Build both H5 firmwares
        run: |
          export UDSLIB_DIR="$PWD"
          export RUST_LLD="$(find "$(rustc --print sysroot)" -name rust-lld | head -1)"
          echo "Using rust-lld: $RUST_LLD"
          make -C examples/h5_uds_ecu_full/firmware
          make -C examples/h5_uds_tester/firmware

      - name: Run the all-services gate (headless, asserts 27/27)
        id: labwired
        uses: w1ne/labwired-core/.github/actions/labwired-test@fda6a7bfb0328d9909ee07ba53ed05c84901f627
        with:
          version: v0.19.1
          script: examples/h5_uds_tester/allservices-gate.yaml
          output-dir: labwired-uds-report
          args: --no-uart-stdout
