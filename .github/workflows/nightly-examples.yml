# Nightly: build AND run every host-runnable example.
#
# The per-PR CI only builds a subset of examples (client_demo, the two crypto
# examples, zephyr). The handler-contract is public API, and the examples are
# its migration guide, so they must not rot unbuilt. This workflow builds and
# runs all host examples every night (and on demand) as a real gate.
name: nightly-examples

on:
  schedule:
    # 03:17 UTC daily (off the hour to avoid the cron stampede).
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t udslib-test-env -f Dockerfile .

      - name: Build & run every host example
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -u "$(id -u):$(id -g)" \
            udslib-test-env \
            bash -c '
              set -euo pipefail

              # Examples that build into a host binary and run to completion.
              RUN_EXAMPLES="auth_challenge custom_service dtc_clear dtc_full_coverage dtc_store"
              for ex in $RUN_EXAMPLES; do
                echo "=== run: $ex ==="
                make -C "examples/$ex" clean
                make -C "examples/$ex" run
              done

              # Examples that are host build-only (no self-contained run target).
              BUILD_EXAMPLES="client_demo host_sim"
              for ex in $BUILD_EXAMPLES; do
                echo "=== build: $ex ==="
                make -C "examples/$ex" clean
                make -C "examples/$ex"
              done

              # Crypto examples: build and run against BOTH back-ends, asserting a
              # success marker (mirrors the per-PR crypto gate, kept here so the
              # nightly sweep is the single complete example gate).
              for ex in auth_challenge_mbedtls security_access_mbedtls; do
                for crypto in mbedtls wolfssl; do
                  echo "=== crypto: $ex ($crypto) ==="
                  make -C "examples/$ex" clean
                  make -C "examples/$ex" CRYPTO="$crypto"
                  out=$("examples/$ex/uds_$ex")
                  echo "$out"
                  case $ex in
                    auth_challenge_mbedtls)
                      echo "$out" | grep -q "ctx.security.authenticated = true"
                      echo "$out" | grep -q "69 03 02" ;;
                    security_access_mbedtls)
                      echo "$out" | grep -q "ctx.security.level = 2"
                      echo "$out" | grep -q "7F BA 33" ;;
                  esac
                  make -C "examples/$ex" clean
                done
              done

              echo "All host examples built and ran."
            '

  # The STM32H563 secure-boot bootloader is the one firmware example built by no
  # other gate. It cross-compiles with arm-none-eabi-gcc and needs the STM32
  # CMSIS + mbedTLS-3.6 source trees, which a Zephyr west workspace provides at
  # the paths the bootloader Makefile defaults to. (The h5 firmwares are
  # compile-checked per-PR in ci.yml core-gate and fully built + sim-run in
  # nightly-h5-gate.)
  firmware-bootloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain + west
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-pip
          pip3 install --no-cache-dir --break-system-packages west

      - name: Initialise Zephyr workspace (STM32 CMSIS + mbedTLS-3.6 modules)
        run: |
          # Same manifest/pin as ci.yml build-zephyr; brings modules/hal/stm32,
          # modules/hal/cmsis_6, and modules/crypto/mbedtls-3.6 — the bootloader
          # Makefile's default CUBE_DIR / CMSIS_DIR / MBEDTLS_DIR.
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.1 zephyr-workspace
          cd zephyr-workspace
          west update --narrow -o=--depth=1
          cd ..

      - name: Build bootloader ELF + signed app images, run host crypto tests
        run: |
          export UDSLIB_DIR="$PWD"
          BL=examples/h563_uds_bootloader
          # Generate the A / B / tampered / bad-signature signed images that the
          # rsa/image tests verify against.
          make -C "$BL/app" all-four
          # Cross-compile the bootloader firmware ELF (real STM32H563 target).
          make -C "$BL/bootloader"
          # Host-runnable crypto + state unit tests bundled with the bootloader.
          for t in cmac-test rsa-test image-test bootstate-test otaversion-test; do
            echo "=== bootloader test: $t ==="
            make -C "$BL/bootloader" "$t"
          done
          echo "Bootloader firmware + host tests OK."
